title = "Order"

changelog = true

[docusaurus]
onBrokenLinks = "warn"
url = "https://order.atomichorizon.net"
baseUrl = "/"
favicon = "/img/favicon.ico"
tagline = "A lightweight Luau framework for structuring Roblox games"
# GitHub Pages serves page.html at /page, so canonical URLs match the served
# URL instead of redirecting to a trailing slash
trailingSlash = false

# Added to every page. Moonwave sets themeConfig itself, so site-wide social
# preview tags go here instead of themeConfig.image
[[docusaurus.headTags]]
tagName = "meta"
[docusaurus.headTags.attributes]
property = "og:site_name"
content = "Order"

[[docusaurus.headTags]]
tagName = "meta"
[docusaurus.headTags.attributes]
property = "og:image"
content = "https://order.atomichorizon.net/img/embed_banner.png"

[[docusaurus.headTags]]
tagName = "meta"
[docusaurus.headTags.attributes]
name = "twitter:image"
content = "https://order.atomichorizon.net/img/embed_banner.png"

[[docusaurus.headTags]]
tagName = "link"
[docusaurus.headTags.attributes]
rel = "alternate"
type = "text/plain"
title = "llms.txt"
href = "https://order.atomichorizon.net/llms.txt"

[home]
enabled = true
includeReadme = false

[footer]
style = "dark"
copyright = "Copyright © 2026 Atomic Horizon LLC"

[[footer.links]]
title = "Docs"

  [[footer.links.items]]
  label = "Getting Started"
  to = "/docs/intro"

  [[footer.links.items]]
  label = "Usage"
  to = "/docs/usage"

  [[footer.links.items]]
  label = "Special Notes"
  to = "/docs/notes"

[[footer.links]]
title = "API"

  [[footer.links.items]]
  label = "API Reference"
  to = "/api"

  [[footer.links.items]]
  label = "AtomicUI"
  to = "/docs/atomicui"

[[footer.links]]
title = "More"

  [[footer.links.items]]
  label = "GitHub"
  href = "https://github.com/atomic-horizon/order"

  [[footer.links.items]]
  label = "Roblox Marketplace"
  href = "https://www.roblox.com/library/11152308855/"

[navbar.logo]
alt = 'Logo'
src = '/img/icon.svg'
href = '/'
target = '_self'
